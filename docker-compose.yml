# Postgres cho môi trường dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: supportive
      POSTGRES_PASSWORD: supportive
      POSTGRES_DB: supportive_ai
    ports:
      # 5433 chứ không phải 5432: nhiều máy dev đã cài sẵn PostgreSQL local
      # chiếm cổng 5432, và khi đó kết nối từ host sẽ vào nhầm bản local.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportive -d supportive_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

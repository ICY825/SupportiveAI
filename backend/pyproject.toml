[project]
name = "supportive-ai-backend"
version = "0.1.0"
description = "Nền tảng ứng dụng AI cho nghiệp vụ Hành chính — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "apscheduler>=3.10,<4",
    # Đọc file .xlsx của lễ tân (mail/importer.py, CR-001 §1).
    "openpyxl>=3.1",
    # FastAPI cần cho endpoint tải file lên (POST /mail/batches/upload).
    "python-multipart>=0.0.9",
    # Sinh mã QR dán tại khu để đơn (GET /mail/station/sign). Python thuần,
    # không kéo thêm phụ thuộc nào.
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
